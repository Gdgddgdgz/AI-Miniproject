services:
  - type: web
    name: automl-studio-api
    runtime: docker
    plan: 1c-2g
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /
    disk:
      name: automl-studio-files
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: automl-studio-db
          property: connectionString
      - key: SESSION_STORAGE_DIR
        value: /var/data/sessions
      - key: APP_STORAGE_DIR
        value: /var/data/lakehouse
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: automl-studio-db
    databaseName: automl
    user: automl
    plan: 256mb
    region: singapore
